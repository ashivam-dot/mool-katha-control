name: Control analytics and watchdog

on:
  schedule:
    - cron: '25 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: control-monitor
  cancel-in-progress: false

jobs:
  read:
    if: ${{ github.repository == 'ashivam-dot/mool-katha-control' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check out signed producer receipts as read-only data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ashivam-dot/mool-katha
          ref: main
          ssh-key: ${{ secrets.SOURCE_READONLY_DEPLOY_KEY }}
          path: source
          sparse-checkout: content/episodes
          filter: blob:none
          persist-credentials: false
      - name: Check out archived public delivery proofs as read-only data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: analytics-data
          path: proof-data
          sparse-checkout: analytics/public-delivery
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Read exact destinations and independent QA and release runs
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_CHECKOUT: ${{ github.workspace }}/source
          PUBLIC_PROOF_DIR: ${{ github.workspace }}/proof-data/analytics/public-delivery
          YTC_ENABLE_CONTROL_RELEASE: ${{ vars.YTC_ENABLE_CONTROL_RELEASE }}
          BUFFER_ORG_ID: ${{ vars.BUFFER_ORG_ID }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_YOUTUBE_CHANNEL_ID: ${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          YTC_GOOGLE_CLIENT: ${{ secrets.YTC_GOOGLE_CLIENT }}
          YTC_GOOGLE_TOKEN: ${{ secrets.YTC_GOOGLE_TOKEN }}
        run: python -m trusted_monitor --out "$RUNNER_TEMP/control-monitor.json"
      - name: Keep secret-free report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: control-monitor-${{ github.run_id }}
          path: ${{ runner.temp }}/control-monitor.json
          retention-days: 14
          if-no-files-found: error

  persist:
    needs: read
    if: ${{ always() && github.repository == 'ashivam-dot/mool-katha-control' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out exact control sanitizer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Check out private analytics branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: analytics-data
          path: data
          persist-credentials: true
      - name: Read this run's sanitized monitor artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: control-monitor-${{ github.run_id }}
          path: report
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Keep only allowlisted analytics in the control branch
        env:
          PYTHONPATH: ${{ github.workspace }}/control
        run: >-
          python -m trusted_monitor.persist
          --report report/control-monitor.json
          --out-dir data/analytics/snapshots
          --proof-dir data/analytics/public-delivery
          --run-key "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Commit append-only private analytics snapshot
        shell: bash
        run: |
          set -euo pipefail
          git -C data config user.name 'Mool Katha independent monitor'
          git -C data config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C data add -A analytics
          if git -C data diff --cached --quiet; then exit 0; fi
          git -C data commit -m "analytics: sanitized control run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
          git -C data push origin HEAD:analytics-data
