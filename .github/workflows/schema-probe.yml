# Checks which reviewer schema shapes Gemini will serve. Sends no episode data.
name: Reviewer schema probe

on:
  workflow_dispatch:
    inputs:
      model:
        required: false
        default: gemini-3.8-flash
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.9.18
          uv sync --frozen --project trusted_qa --python 3.12
      - name: Probe schema shapes
        env:
          QA_GEMINI_API_KEY: ${{ secrets.QA_GEMINI_API_KEY }}
          PROBE_MODEL: ${{ inputs.model }}
        run: trusted_qa/.venv/bin/python -m trusted_qa.schema_probe --model "$PROBE_MODEL"
