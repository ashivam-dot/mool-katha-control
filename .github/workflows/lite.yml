# Mool Katha lite lane: one fetched source passage -> one Hindi Short + Reel, one lightweight gate, Buffer.
# Separate from the signed release path. Producer code (render, TTS, captions, Buffer helpers) is imported from
# a pinned, read-only producer checkout; nothing is written to the producer repository.
name: Lite lane

on:
  schedule:
    - cron: '30 1 * * *'    # 07:00 IST, yesterday's leftover quota
    - cron: '40 7 * * *'    # 13:10 IST, after the 07:00 UTC Gemini reset; normally fills 17:30 IST
    - cron: '50 10 * * *'   # 16:20 IST; normally fills 21:45 IST
    - cron: '20 13 * * *'   # 18:50 IST catch-up for 21:45 IST
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run renders and gates only; publish also schedules on Buffer'
        type: choice
        required: true
        default: dry-run
        options: [dry-run, publish, picture-probe]
      art:
        description: 'ai paints each beat with Z-Image-Turbo (museum paintings if that fails); paintings skips it'
        type: choice
        required: false
        default: ai
        options: [ai, paintings]
      replay:
        description: 'dry-run only: repository path of a reviewed script JSON to paint and render again'
        type: string
        required: false
        default: ''
      episodes:
        description: 'picture-probe only: comma-separated ledger episode ids to run past the picture check'
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: mool-katha-lite
  cancel-in-progress: false

env:
  ART_CACHE_KEY: lite-art-zimage-q4k-sd959-v1

jobs:
  # Scripts the next Short and writes one image prompt per beat. Anything going wrong here only means the run job
  # illustrates the Short with museum paintings, as before.
  plan:
    if: >-
      (github.ref == 'refs/heads/main' || inputs.mode == 'dry-run') &&
      (github.event_name == 'workflow_dispatch' || vars.YTC_ENABLE_LITE == '1') &&
      inputs.mode != 'picture-probe' && inputs.art != 'paintings' && vars.LITE_AI_ART != 'off'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    outputs:
      paint: ${{ steps.plan.outputs.paint }}
      chunks: ${{ steps.plan.outputs.chunks }}
    env:
      PRODUCER_SHA: 274da8a4d1155845e71047b8361efa36b1bdc57e
      BUFFER_ORG_ID: ${{ vars.BUFFER_ORG_ID }}
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'publish' }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
          path: control
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ashivam-dot/mool-katha
          ref: ${{ env.PRODUCER_SHA }}
          ssh-key: ${{ secrets.SOURCE_READONLY_DEPLOY_KEY }}
          path: producer
          persist-credentials: false
      - name: Verify pinned producer and Buffer organization
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C producer rev-parse HEAD)" = "$PRODUCER_SHA"
          test "$BUFFER_ORG_ID" = '6ac066851cde9b9edca25c7b'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          working-directory: producer/pipeline
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install producer dependencies
        working-directory: producer/pipeline
        run: uv sync --frozen
      - name: Script the Short and plan its paintings
        id: plan
        working-directory: producer/pipeline
        env:
          PYTHONPATH: ${{ github.workspace }}/control
          LITE_LEDGER: ${{ github.workspace }}/control/lite-state/ledger.json
          YTC_GEMINI_API_KEY: ${{ secrets.QA_GEMINI_API_KEY }}
          YTC_CONTACT: moolkatha-lite (github.com/ashivam-dot)
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_YOUTUBE_CHANNEL_ID: ${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
          REPLAY: ${{ inputs.replay }}
        run: |
          if [ -n "$REPLAY" ] && [ "$MODE" = dry-run ]; then
            uv run --no-sync python -m lite plan --mode "$MODE" --out "$RUNNER_TEMP/plan" --replay "$GITHUB_WORKSPACE/control/$REPLAY"
          else
            uv run --no-sync python -m lite plan --mode "$MODE" --out "$RUNNER_TEMP/plan"
          fi
      - name: Upload the plan
        if: steps.plan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plan-${{ github.run_id }}
          path: ${{ runner.temp }}/plan
          retention-days: 3
      - name: Is the image model cached?
        id: cached
        if: steps.plan.outputs.paint == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/lite-art
          key: ${{ env.ART_CACHE_KEY }}
          lookup-only: true
      - name: Download the image model once
        if: steps.plan.outputs.paint == 'true' && steps.cached.outputs.cache-hit != 'true'
        working-directory: control
        run: python3 -m lite.imagegen fetch --model zimage --root "$HOME/.cache/lite-art"
      - name: Cache the image model
        if: steps.plan.outputs.paint == 'true' && steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/lite-art
          key: ${{ env.ART_CACHE_KEY }}

  # One job per couple of beats, in parallel: Z-Image-Turbo (Apache-2.0) through stable-diffusion.cpp on the CPU.
  paint:
    needs: plan
    if: needs.plan.outputs.paint == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        beats: ${{ fromJSON(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: lite
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: plan-${{ github.run_id }}
          path: ${{ runner.temp }}/plan
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/lite-art
          key: ${{ env.ART_CACHE_KEY }}
      - name: Paint
        env:
          BEATS: ${{ matrix.beats }}
        run: >-
          python3 -m lite.imagegen beats --prompts "$RUNNER_TEMP/plan/art-plan.json" --only "$BEATS"
          --out "$RUNNER_TEMP/art" --root "$HOME/.cache/lite-art"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: art-${{ github.run_id }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/art
          retention-days: 3
          if-no-files-found: ignore

  lite:
    needs: [plan, paint]
    if: >-
      (github.ref == 'refs/heads/main' || inputs.mode == 'dry-run') &&
      (github.event_name == 'workflow_dispatch' || vars.YTC_ENABLE_LITE == '1') &&
      !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PRODUCER_SHA: 274da8a4d1155845e71047b8361efa36b1bdc57e
      BUFFER_ORG_ID: ${{ vars.BUFFER_ORG_ID }}
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'publish' }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out control (lite code and ledger)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
          path: control
      - name: Check out pinned producer code (read-only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ashivam-dot/mool-katha
          ref: ${{ env.PRODUCER_SHA }}
          ssh-key: ${{ secrets.SOURCE_READONLY_DEPLOY_KEY }}
          path: producer
          persist-credentials: false
      - name: Verify pinned producer and Buffer organization
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C producer rev-parse HEAD)" = "$PRODUCER_SHA"
          test "$BUFFER_ORG_ID" = '6ac066851cde9b9edca25c7b'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          working-directory: producer/pipeline
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install producer dependencies
        working-directory: producer/pipeline
        run: uv sync --frozen
      - name: Cache speech models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: lite-hf-whisper-large-v3-turbo-v1
      - name: Unit tests
        working-directory: producer/pipeline
        env:
          PYTHONPATH: ${{ github.workspace }}/control
        run: uv run --no-sync python -m pytest -q "$GITHUB_WORKSPACE/control/lite/tests"
      - name: Fetch the plan
        if: needs.plan.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: plan-${{ github.run_id }}
          path: ${{ runner.temp }}/plan
      - name: Fetch the paintings
        if: needs.plan.outputs.paint == 'true'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: art-${{ github.run_id }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/art
      - name: Make at most one Short
        id: lite
        working-directory: producer/pipeline
        env:
          PYTHONPATH: ${{ github.workspace }}/control
          LITE_LEDGER: ${{ github.workspace }}/control/lite-state/ledger.json
          YTC_GEMINI_API_KEY: ${{ secrets.QA_GEMINI_API_KEY }}
          YTC_CONTACT: moolkatha-lite (github.com/ashivam-dot)
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_YOUTUBE_CHANNEL_ID: ${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          EPISODES: ${{ inputs.episodes }}
          LITE_PLAN: ${{ runner.temp }}/plan/plan.json
          LITE_ART_DIR: ${{ runner.temp }}/art
        run: |
          if [ "$MODE" = picture-probe ]; then
            uv run --no-sync python -m lite probe --episodes "$EPISODES"
          else
            uv run --no-sync python -m lite run --mode "$MODE" --out "$RUNNER_TEMP/lite-out" --producer-root "$GITHUB_WORKSPACE/producer"
          fi
      - name: Upload the Short and its records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lite-${{ github.run_id }}
          path: ${{ runner.temp }}/lite-out
          retention-days: 14
          if-no-files-found: ignore
      - name: Save the ledger
        if: always() && github.ref == 'refs/heads/main'
        working-directory: control
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Mool Katha lite lane'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lite-state
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "lite: ledger after run $GITHUB_RUN_ID ($MODE)"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
      - name: Tell the owner when a run fails
        if: failure()
        env:
          YTC_NTFY_TOPIC: ${{ secrets.YTC_NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ -n "${YTC_NTFY_TOPIC:-}" ]; then
            curl -fsS -m 20 -H "Title: Mool Katha lite run failed" -d "$RUN_URL" "https://ntfy.sh/$YTC_NTFY_TOPIC" >/dev/null || true
          fi
