# Mool Katha lite lane: one fetched source passage -> one Hindi Short + Reel, one lightweight gate, Buffer.
# Separate from the signed release path. Producer code (render, TTS, captions, Buffer helpers) is imported from
# a pinned, read-only producer checkout; nothing is written to the producer repository.
name: Lite lane

on:
  schedule:
    - cron: '30 1 * * *'    # 07:00 IST, yesterday's leftover quota
    - cron: '40 7 * * *'    # 13:10 IST, after the 07:00 UTC Gemini reset; normally fills 17:30 IST
    - cron: '50 10 * * *'   # 16:20 IST; normally fills 21:45 IST
    - cron: '20 13 * * *'   # 18:50 IST catch-up for 21:45 IST
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run renders and gates only; publish also schedules on Buffer'
        type: choice
        required: true
        default: dry-run
        options: [dry-run, publish, picture-probe]
      episodes:
        description: 'picture-probe only: comma-separated ledger episode ids to run past the picture check'
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: mool-katha-lite
  cancel-in-progress: false

jobs:
  lite:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.YTC_ENABLE_LITE == '1')
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      PRODUCER_SHA: 274da8a4d1155845e71047b8361efa36b1bdc57e
      BUFFER_ORG_ID: ${{ vars.BUFFER_ORG_ID }}
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'publish' }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out control (lite code and ledger)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: control
      - name: Check out pinned producer code (read-only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ashivam-dot/mool-katha
          ref: ${{ env.PRODUCER_SHA }}
          ssh-key: ${{ secrets.SOURCE_READONLY_DEPLOY_KEY }}
          path: producer
          persist-credentials: false
      - name: Verify pinned producer and Buffer organization
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C producer rev-parse HEAD)" = "$PRODUCER_SHA"
          test "$BUFFER_ORG_ID" = '6ac066851cde9b9edca25c7b'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          working-directory: producer/pipeline
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install producer dependencies
        working-directory: producer/pipeline
        run: uv sync --frozen
      - name: Cache speech models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: lite-hf-whisper-large-v3-turbo-v1
      - name: Unit tests
        working-directory: producer/pipeline
        env:
          PYTHONPATH: ${{ github.workspace }}/control
        run: uv run --no-sync python -m pytest -q "$GITHUB_WORKSPACE/control/lite/tests"
      - name: Make at most one Short
        id: lite
        working-directory: producer/pipeline
        env:
          PYTHONPATH: ${{ github.workspace }}/control
          LITE_LEDGER: ${{ github.workspace }}/control/lite-state/ledger.json
          YTC_GEMINI_API_KEY: ${{ secrets.QA_GEMINI_API_KEY }}
          YTC_CONTACT: moolkatha-lite (github.com/ashivam-dot)
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_YOUTUBE_CHANNEL_ID: ${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          EPISODES: ${{ inputs.episodes }}
        run: |
          if [ "$MODE" = picture-probe ]; then
            uv run --no-sync python -m lite probe --episodes "$EPISODES"
          else
            uv run --no-sync python -m lite run --mode "$MODE" --out "$RUNNER_TEMP/lite-out" --producer-root "$GITHUB_WORKSPACE/producer"
          fi
      - name: Upload the Short and its records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lite-${{ github.run_id }}
          path: ${{ runner.temp }}/lite-out
          retention-days: 14
          if-no-files-found: ignore
      - name: Save the ledger
        if: always()
        working-directory: control
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Mool Katha lite lane'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lite-state
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "lite: ledger after run $GITHUB_RUN_ID ($MODE)"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
      - name: Tell the owner when a run fails
        if: failure()
        env:
          YTC_NTFY_TOPIC: ${{ secrets.YTC_NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ -n "${YTC_NTFY_TOPIC:-}" ]; then
            curl -fsS -m 20 -H "Title: Mool Katha lite run failed" -d "$RUN_URL" "https://ntfy.sh/$YTC_NTFY_TOPIC" >/dev/null || true
          fi
