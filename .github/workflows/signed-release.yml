# Publisher credentials live only in this independent repository. The mutable
# producer checkout is data; the executable release implementation is pinned to
# an exact reviewed commit and never imports Python from source/.
name: Signed release from independent control

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Verify pinned code, source write access, and Buffer destinations without releasing'
        type: choice
        required: true
        default: verify-only
        options: [verify-only, release]

permissions:
  contents: read

concurrency:
  group: independent-signed-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.mode == 'verify-only') ||
       (vars.YTC_ENABLE_CONTROL_RELEASE == '1' &&
        (github.event_name == 'schedule' || inputs.mode == 'release')))
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      YTC_ENABLE_SIGNED_RELEASE: '1'
      YTC_ENABLE_AUTOMATION: '0'
      BUFFER_ORG_ID: ${{ vars.BUFFER_ORG_ID }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out immutable release code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ashivam-dot/mool-katha
          ref: 38b7571c061883b0713602913b51130ab152b903
          ssh-key: ${{ secrets.SOURCE_READONLY_DEPLOY_KEY }}
          path: trusted
          persist-credentials: false
      - name: Check out producer data and receipt destination
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ashivam-dot/mool-katha
          ref: main
          ssh-key: ${{ secrets.SOURCE_WRITE_DEPLOY_KEY }}
          path: source
          fetch-depth: 0
          persist-credentials: true
      - name: Check out control readback code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Verify exact trusted code and source branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = '38b7571c061883b0713602913b51130ab152b903'
          test "$(git -C control rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C source branch --show-current)" = 'main'
          test -z "$(git -C source status --porcelain)"
          test "$BUFFER_ORG_ID" = '6ac066851cde9b9edca25c7b'
          git -C source push --dry-run origin HEAD:main
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          working-directory: trusted/pipeline
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install pinned release dependencies
        working-directory: trusted/pipeline
        run: uv sync --frozen
      - name: Verify exact Buffer destinations
        working-directory: trusted/pipeline
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_YOUTUBE_CHANNEL_ID: ${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
        run: |
          uv run --no-sync python - <<'PY'
          import os
          from pathlib import Path
          from ytc import publish

          if Path(publish.__file__).resolve() != Path.cwd().resolve() / "src/ytc/publish.py":
              raise RuntimeError("publisher module is outside the pinned checkout")
          for service, name in (("youtube", "BUFFER_YOUTUBE_CHANNEL_ID"),
                                ("instagram", "BUFFER_INSTAGRAM_CHANNEL_ID")):
              channel_id = os.environ.get(name, "").strip()
              if not channel_id:
                  raise RuntimeError(f"{name} is missing")
              publish._require_channel(channel_id, service, ready=True)
          print("Both exact Buffer destinations are ready")
          PY
      - name: Release at most one exact signed candidate
        if: ${{ vars.YTC_ENABLE_CONTROL_RELEASE == '1' && inputs.mode != 'verify-only' }}
        working-directory: trusted/pipeline
        env:
          SOURCE_CHECKOUT: ${{ github.workspace }}/source
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_YOUTUBE_CHANNEL_ID: ${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          PYTHONPATH: ${{ github.workspace }}/control
        run: |
          uv run --no-sync python - <<'PY'
          import json
          import os
          from pathlib import Path
          import modal
          from ytc import qa_release
          from trusted_release.readback import verify_after_release

          try:
              workspace = modal.Workspace.from_context().hydrate().name
          except Exception:
              raise RuntimeError('Modal workspace could not be verified') from None
          if workspace != 'mool-katha-producer':
              raise RuntimeError('Modal token does not belong to mool-katha-producer')
          if Path(qa_release.__file__).resolve() != Path.cwd().resolve() / "src/ytc/qa_release.py":
              raise RuntimeError("release module is outside the pinned checkout")
          root = Path(os.environ["SOURCE_CHECKOUT"]).resolve()
          result = qa_release.run_once(root)
          readbacks = verify_after_release(
              root, result, publisher=qa_release.publish,
              policy=qa_release.trusted_policy(),
              evidence_gate=qa_release.require_episode_evidence,
              youtube_id=os.environ["BUFFER_YOUTUBE_CHANNEL_ID"],
              instagram_id=os.environ["BUFFER_INSTAGRAM_CHANNEL_ID"],
          )
          print(json.dumps(result, ensure_ascii=False, sort_keys=True))
          print(json.dumps({"platform_readbacks": readbacks}, sort_keys=True))
          PY
      - name: Save signed evidence and post receipts to the producer data branch
        if: ${{ always() && vars.YTC_ENABLE_CONTROL_RELEASE == '1' && inputs.mode != 'verify-only' }}
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Mool Katha independent release'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A content/episodes
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "release: independent signed QA run $GITHUB_RUN_ID"
          git push origin HEAD:main
