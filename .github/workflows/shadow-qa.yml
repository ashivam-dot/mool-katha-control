# Diagnostic branch only: probe which Gemini models the QA key can call. Never signs or publishes.
name: Shadow independent QA (unsigned)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Probe Gemini models
        env:
          QA_GEMINI_API_KEY: ${{ secrets.QA_GEMINI_API_KEY }}
        run: python3 .github/gemini_probe.py
