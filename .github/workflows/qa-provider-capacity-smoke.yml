name: Check independent QA Gemini capacity class

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install image decoder for one exact frame tile
        run: python -m pip install Pillow==11.3.0
      - name: Download exact failed frame request
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: private-qa-ep022-90e61a514265a54e45a76b919f21cce563599365816933ab1cf101590946d70b
          path: qa-output
          run-id: 37200191200
          github-token: ${{ github.token }}
      - name: Probe text and one frame tile without logging provider body
        env:
          QA_GEMINI_API_KEY: ${{ secrets.QA_GEMINI_API_KEY }}
        run: python .github/scripts/qa_provider_capacity_probe.py
