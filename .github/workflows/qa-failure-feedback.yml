# Only an exact content hold from the immutable qa-v9 run may park its draft.
# The inspector has no source write key; the writer never opens QA artifacts.
name: Independent QA failure feedback

on:
  workflow_run:
    workflows: [Signed independent QA]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: independent-qa-feedback
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.repository == 'ashivam-dot/mool-katha-control' &&
      github.ref == 'refs/heads/main' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == 'ashivam-dot/mool-katha-control' &&
      github.event.workflow_run.head_branch == 'qa-v9' &&
      github.event.workflow_run.head_sha == '17b8162c0fee22c7a0a5427b449f3b263b5648d5'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      hold: ${{ steps.hold.outputs.hold }}
      episode: ${{ steps.candidate.outputs.episode }}
      video_sha: ${{ steps.candidate.outputs.video_sha }}
      source_commit: ${{ steps.candidate.outputs.source_commit }}
      reason_code: ${{ steps.hold.outputs.reason_code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Download exact run discovery
        id: discovery
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: private-qa-discovery
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: discovery
      - name: Validate one discovered candidate
        id: candidate
        if: steps.discovery.outcome == 'success'
        run: python -m trusted_feedback candidate --discovery discovery/result.json --github-output "$GITHUB_OUTPUT"
      - name: Download only its private QA result
        id: qa_result
        if: steps.candidate.outputs.candidate == 'true'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: private-qa-${{ steps.candidate.outputs.episode }}-${{ steps.candidate.outputs.video_sha }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: qa-result
      - name: Admit only a specific content hold
        id: hold
        if: steps.qa_result.outcome == 'success'
        env:
          QA_EPISODE: ${{ steps.candidate.outputs.episode }}
          QA_VIDEO_SHA: ${{ steps.candidate.outputs.video_sha }}
          QA_SOURCE_COMMIT: ${{ steps.candidate.outputs.source_commit }}
        run: >-
          python -m trusted_feedback inspect-hold
          --hold qa-result/episode/private/agent-qa-hold.json
          --episode "$QA_EPISODE" --video-sha "$QA_VIDEO_SHA"
          --source-commit "$QA_SOURCE_COMMIT" --github-output "$GITHUB_OUTPUT"
      - name: Summarize QA feedback
        if: always()
        env:
          QA_HOLD: ${{ steps.hold.outputs.hold }}
          QA_EPISODE: ${{ steps.candidate.outputs.episode }}
        run: |
          if [ "$QA_HOLD" = true ]; then
            printf 'Exact content hold for %s is eligible for a producer editorial lock.\n' "$QA_EPISODE" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'No exact content hold admitted; the failed QA run remains visible to the control monitor.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

  hold:
    needs: inspect
    if: needs.inspect.outputs.hold == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ashivam-dot/mool-katha
          ref: main
          ssh-key: ${{ secrets.SOURCE_WRITE_DEPLOY_KEY }}
          path: source
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Recheck exact producer tree and commit its editorial lock
        env:
          QA_EPISODE: ${{ needs.inspect.outputs.episode }}
          QA_VIDEO_SHA: ${{ needs.inspect.outputs.video_sha }}
          QA_SOURCE_COMMIT: ${{ needs.inspect.outputs.source_commit }}
          QA_REASON_CODE: ${{ needs.inspect.outputs.reason_code }}
          QA_RUN_ID: ${{ github.event.workflow_run.id }}
          QA_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: >-
          python -m trusted_feedback apply --source-repo source
          --episode "$QA_EPISODE" --video-sha "$QA_VIDEO_SHA"
          --source-commit "$QA_SOURCE_COMMIT" --reason-code "$QA_REASON_CODE"
          --run-id "$QA_RUN_ID" --run-attempt "$QA_RUN_ATTEMPT"
