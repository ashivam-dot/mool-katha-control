# Only an exact content hold from the immutable qa-v19 run may park its draft.
# The inspector has no source write key; the writer never opens QA artifacts.
name: Independent QA failure feedback

on:
  workflow_run:
    workflows: [Signed independent QA]
    types: [completed]
  # Runs dispatched by the scheduled QA use the Actions token, which raises no
  # workflow_run event, so a failed QA run asks for feedback with its own ID.
  workflow_dispatch:
    inputs:
      qa_run_id:
        description: Failed pinned QA run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: independent-qa-feedback
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.repository == 'ashivam-dot/mool-katha-control' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || (
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == 'ashivam-dot/mool-katha-control' &&
      github.event.workflow_run.head_branch == 'qa-v19' &&
      github.event.workflow_run.head_sha == '07a920b8ff6499a8ea7ba12d2da9d1a6b43b5d39'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      hold: ${{ steps.hold.outputs.hold }}
      holds: ${{ steps.hold.outputs.holds }}
      run_id: ${{ steps.run.outputs.id }}
      run_attempt: ${{ steps.run.outputs.attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Resolve the exact failed QA run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          INPUT_RUN_ID: ${{ inputs.qa_run_id }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            printf 'id=%s\nattempt=%s\n' "$EVENT_RUN_ID" "$EVENT_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          else
            python -m trusted_feedback verify-run --run-id "$INPUT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --tag 'qa-v19' --sha '07a920b8ff6499a8ea7ba12d2da9d1a6b43b5d39' --github-output "$GITHUB_OUTPUT"
          fi
      - name: Download exact run discovery
        id: discovery
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: private-qa-discovery
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
          path: discovery
      - name: Validate the discovered candidates
        id: candidates
        if: steps.discovery.outcome == 'success'
        run: python -m trusted_feedback candidates --discovery discovery/result.json --github-output "$GITHUB_OUTPUT"
      - name: Download only their private QA results
        if: steps.candidates.outputs.artifacts != ''
        env:
          GH_TOKEN: ${{ github.token }}
          QA_RUN_ID: ${{ steps.run.outputs.id }}
          QA_ARTIFACTS: ${{ steps.candidates.outputs.artifacts }}
        run: |
          for name in $QA_ARTIFACTS; do
            gh run download "$QA_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "qa-results/$name" || true
          done
      - name: Admit only specific content holds
        id: hold
        if: steps.candidates.outputs.artifacts != ''
        run: >-
          python -m trusted_feedback inspect-all --discovery discovery/result.json
          --qa-root qa-results --github-output "$GITHUB_OUTPUT"
      - name: Summarize QA feedback
        if: always()
        env:
          QA_HOLD: ${{ steps.hold.outputs.hold }}
        run: |
          if [ "$QA_HOLD" = true ]; then
            printf 'Exact content holds are eligible for producer editorial locks.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'No exact content hold admitted; the failed QA run remains visible to the control monitor.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

  hold:
    needs: inspect
    if: needs.inspect.outputs.hold == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.inspect.outputs.holds) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ashivam-dot/mool-katha
          ref: main
          ssh-key: ${{ secrets.SOURCE_WRITE_DEPLOY_KEY }}
          path: source
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Recheck exact producer tree and commit its editorial lock
        env:
          QA_EPISODE: ${{ matrix.episode }}
          QA_VIDEO_SHA: ${{ matrix.video_sha }}
          QA_SOURCE_COMMIT: ${{ matrix.source_commit }}
          QA_REASON_CODE: ${{ matrix.reason_code }}
          QA_RUN_ID: ${{ needs.inspect.outputs.run_id }}
          QA_RUN_ATTEMPT: ${{ needs.inspect.outputs.run_attempt }}
        run: >-
          python -m trusted_feedback apply --source-repo source
          --episode "$QA_EPISODE" --video-sha "$QA_VIDEO_SHA"
          --source-commit "$QA_SOURCE_COMMIT" --reason-code "$QA_REASON_CODE"
          --run-id "$QA_RUN_ID" --run-attempt "$QA_RUN_ATTEMPT"
