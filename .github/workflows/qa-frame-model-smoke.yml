name: Check independent QA frame model transport

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Download exact failed frame request
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: private-qa-ep022-90e61a514265a54e45a76b919f21cce563599365816933ab1cf101590946d70b
          path: qa-output
          run-id: 37200191200
          github-token: ${{ github.token }}
      - name: Send one request and print status class only
        env:
          QA_GEMINI_API_KEY: ${{ secrets.QA_GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          source = Path('qa-output/episode/private/frame-batch-001-request.json')
          body = source.read_bytes()
          expected = 'fcdc4698af9d027ed94d4874eaf356ec00fd77dca8caea5c368b46d6b887e299'
          if hashlib.sha256(body).hexdigest() != expected:
              raise SystemExit('saved frame request digest mismatch')
          key = os.environ.get('QA_GEMINI_API_KEY', '')
          if not key:
              raise SystemExit('QA model credential is unavailable')
          request = urllib.request.Request(
              'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent',
              data=body,
              headers={'Content-Type': 'application/json', 'x-goog-api-key': key},
              method='POST',
          )
          try:
              with urllib.request.urlopen(request, timeout=300) as response:
                  raw = response.read(1024 * 1024 + 1)
                  print(f'provider_http_status={response.status}')
                  print(f'provider_response_size_valid={len(raw) <= 1024 * 1024}')
          except urllib.error.HTTPError as exc:
              print(f'provider_http_status={exc.code}')
          except (OSError, urllib.error.URLError) as exc:
              print(f'provider_transport_class={type(exc).__name__}')
          else:
              try:
                  provider = json.loads(raw)
                  parts = provider['candidates'][0]['content']['parts']
                  answer = ''.join(part.get('text', '') for part in parts)
                  decision = json.loads(answer)
                  checked = decision.get('checked_indices')
                  defects = decision.get('defect_indices')
                  label = decision.get('decision')
                  valid = (set(decision) == {
                      'decision', 'uncertainty', 'checked_indices', 'defect_indices', 'notes'}
                      and isinstance(checked, list) and isinstance(defects, list)
                      and label in ('clear', 'hold'))
                  print(f'frame_review_schema_valid={valid}')
                  print(f'frame_review_checked_count={len(checked) if valid else 0}')
                  print(f'frame_review_defect_count={len(defects) if valid else 0}')
                  print(f'frame_review_decision={label if valid else "invalid"}')
              except (KeyError, IndexError, TypeError, ValueError):
                  print('frame_review_schema_valid=false')
          PY
